# The whole system, from containers.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Six services: the two stores, a one-shot migration, and the three application
# processes — all three from the same image, differing only in `command:`.
#
# Configuration comes from a .env file next to this one. At minimum set API_KEYS or
# ADMIN_PASSWORD (or both) and SESSION_SECRET before this is reachable from anywhere;
# see .env.example.

# The shared environment, as its own anchor.
#
# It is separate from &app because `<<:` merges one level only — a service that
# declares its own `environment:` REPLACES the whole map rather than adding to it.
# So each service merges this map explicitly with `<<: *env` and adds its extras.
x-env: &env
  # Inside the compose network the stores answer on their service names and their
  # real ports — the 5433 in the local setup is only there because this machine
  # already runs a Postgres.
  REDIS_URL: redis://redis:6379
  DATABASE_URL: postgres://queueflow:${POSTGRES_PASSWORD:-queueflow}@postgres:5432/queueflow

  API_KEYS: ${API_KEYS:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  SESSION_SECRET: ${SESSION_SECRET:-}

  RETRY_BASE_MS: ${RETRY_BASE_MS:-1000}
  RETRY_MAX_MS: ${RETRY_MAX_MS:-60000}
  HEARTBEAT_TTL_S: ${HEARTBEAT_TTL_S:-30}
  HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-10000}
  REAP_INTERVAL_MS: ${REAP_INTERVAL_MS:-5000}
  ORPHAN_AGE_S: ${ORPHAN_AGE_S:-60}
  FENCING: ${FENCING:-on}

x-app: &app
  build: .
  image: queueflow:latest
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    # Redis is named here even though `migrate` already gates startup on Postgres, and
    # the reason is SHUTDOWN rather than startup. Compose stops a service before the
    # things it depends on; without this line Redis is not a declared dependency of
    # anything, so it can be stopped alongside the worker — and a draining worker still
    # needs Redis for the LREM on each finished job and the final heartbeat DEL. Losing
    # it mid-drain turns a clean exit into a failed one.
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    # Persistence is ON here, unlike the dev compose file.
    #
    # The argument for leaving it off was that Redis is only a transport and
    # everything that matters is in Postgres. That is half true. The job rows are in
    # Postgres and they are safe. But the fact that "worker w1 is holding job X"
    # exists in exactly one place — the NAME of the key queueflow:processing:w1 —
    # and the reaper finds stranded jobs by scanning for those key names. No key, no
    # scan, no rescue: the row sits at 'running' for ever and nothing reports it.
    #
    # So an empty Redis does not just lose queued work, it makes in-flight work
    # invisible. Without this line an ordinary `docker compose down && up` does that.
    #
    # AOF rather than --save snapshots because it is written as each command
    # happens, not at a checkpoint — a crash or a power cut cannot skip it. The cost
    # is one fsync per second, and at most a second of writes lost, which is harmless
    # here: a lost LREM leaves a finished id in a processing list and the reaper
    # discards it after reading the row; a lost LPUSH leaves a 'queued' row that the
    # orphan sweep pushes back.
    #
    # This is a mitigation, not a fix — see GAP-5.8. Losing the volume still strands
    # the same jobs.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: queueflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-queueflow}
      POSTGRES_DB: queueflow
    # The volume is the point. This is the record of every job that ever ran; without
    # it a restart empties the dashboard.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueflow -d queueflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runs schema.sql and exits. Everything in it is IF NOT EXISTS, so running it on
  # every deploy is safe and means a schema change needs no separate step.
  migrate:
    build: .
    image: queueflow:latest
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://queueflow:${POSTGRES_PASSWORD:-queueflow}@postgres:5432/queueflow
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "dist/api/index.js"]
    environment:
      <<: *env
      PORT: 4000
      # Set this when something terminates TLS in front of the container — a
      # reverse proxy, a load balancer, a PaaS router. Without it the session
      # cookie loses its Secure flag. Leave unset when exposed directly.
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    command: ["node", "dist/worker/index.js"]
    environment:
      <<: *env
      # WORKER_ID deliberately not set. Each worker needs its own id — it names the Redis key
      # holding that worker's in-flight jobs — and with WORKER_ID unset the worker
      # falls back to its hostname, which in a container is the container id. So
      # `--scale worker=3` gives three distinct ids with no configuration.
      CONCURRENCY: ${CONCURRENCY:-5}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-25000}

    # How long Docker waits after SIGTERM before SIGKILL. THESE TWO NUMBERS MOVE
    # TOGETHER, and this one must be the larger: the worker uses its window to finish
    # the jobs it is holding and then delete its heartbeat, and being killed mid-drain
    # is worse than never draining — the jobs are stranded anyway AND the heartbeat is
    # left behind, so recovery waits out the full TTL instead of one reap interval.
    #
    # Raise both if your handlers legitimately run longer than this. The default 10s
    # is not enough for a worker holding five jobs.
    stop_grace_period: 30s

  scheduler:
    <<: *app
    command: ["node", "dist/scheduler/index.js"]
    environment:
      <<: *env

volumes:
  pgdata:
  # Redis's AOF lives here. Without it the file is written inside the container and
  # deleted along with it, which is persistence that does nothing.
  redisdata:
